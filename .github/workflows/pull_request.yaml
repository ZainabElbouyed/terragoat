name: build
on:
  pull_request

jobs:
  kics-job:
    runs-on: ubuntu-latest
    name: kics-action
    permissions:
      actions: read
      contents: read
      security-events: write # Nécessaire pour uploader les résultats SARIF
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Run KICS Scan
        uses: checkmarx/kics-github-action@v2.1.20
        with:
          path: 'terraform'
          output_path: 'kicsResults/'
          output_formats: 'json,sarif'
          # fail_on: high # Décommente pour faire échouer le job sur les findings HIGH
          ignore_on_exit: results

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v3
        if: always() # Upload même si KICS a trouvé des problèmes
        with:
          sarif_file: kicsResults/results.sarif
